name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * 0" # every Sunday at midnight
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-stats.svg
          user: CarlosDanielDev
          template: classic
          base: header, activity, community
          base_indepth: no
          config_timezone: America/Sao_Paulo
          repositories_forks: no

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-languages.svg
          user: CarlosDanielDev
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: programming
          plugin_languages_colors: github
          plugin_languages_ignored: html, css, scss, shell, makefile, dockerfile, powershell, starlark, smpl, roff, vcl, smarty, freemarker, gherkin, applescript, hack, objective-c++
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 0%
          plugin_languages_indepth: no
          repositories_forks: no

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-streak.svg
          user: CarlosDanielDev
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
