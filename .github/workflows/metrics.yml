          git add github-streak-card.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: update streak card SVG [skip ci]"
          for i in $(seq 1 6); do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((RANDOM % 6 + 2))
          done
