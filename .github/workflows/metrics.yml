name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * 0" # every Sunday at midnight
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVG
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          STATS_USER: CarlosDanielDev
        run: python3 scripts/generate-stats-svg.py

      - name: Commit stats SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: update stats SVG [skip ci]"
          git pull --rebase --autostash origin main
          git push

  calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-streak.svg
          user: CarlosDanielDev
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          committer_message: "chore: update github-streak.svg [skip ci]"

  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch repository languages from GitHub API
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          gh api graphql -f query='{
            viewer {
              repositories(first: 100, ownerAffiliations: OWNER, isFork: false) {
                nodes {
                  languages(first: 10, orderBy: {field: SIZE, direction: DESC}) {
                    edges { size node { name } }
                  }
                }
                pageInfo { hasNextPage endCursor }
              }
            }
          }' > /tmp/p1.json

          cursor=$(jq -r '.data.viewer.repositories.pageInfo.endCursor' /tmp/p1.json)
          has_next=$(jq -r '.data.viewer.repositories.pageInfo.hasNextPage' /tmp/p1.json)

          if [ "$has_next" = "true" ]; then
            gh api graphql -f query="
            {
              viewer {
                repositories(first: 100, ownerAffiliations: OWNER, isFork: false, after: \"$cursor\") {
                  nodes {
                    languages(first: 10, orderBy: {field: SIZE, direction: DESC}) {
                      edges { size node { name } }
                    }
                  }
                }
              }
            }" > /tmp/p2.json
          fi

      - name: Generate languages SVG
        env:
          PAGE1_JSON: /tmp/p1.json
          PAGE2_JSON: /tmp/p2.json
        run: python3 scripts/generate-languages-svg.py

      - name: Commit languages SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-languages.svg
          git diff --staged --quiet || (git commit -m "chore: update languages SVG [skip ci]" && git push)
