name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * 0" # every Sunday at midnight
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVG
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          STATS_USER: CarlosDanielDev
        run: python3 scripts/generate-stats-svg.py

      - name: Commit stats SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: update stats SVG [skip ci]"
          for i in $(seq 1 6); do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((RANDOM % 6 + 2))
          done
          exit 1

  activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity SVG
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          STATS_USER: CarlosDanielDev
        run: python3 scripts/generate-activity-svg.py

      - name: Commit activity SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-activity.svg
