            sleep $((RANDOM % 6 + 2))
          done
          exit 1

  streak_card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak card SVG
        env:
