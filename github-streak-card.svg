<text x="127" y="124" class="rng">All time</text>
<circle cx="380" cy="74" r="34" fill="none" stroke="url(#ring)" stroke-width="4"/>
<text x="380" y="84" class="fire">14</text>
<text x="380" y="134" class="lbl">Current Streak</text>
<text x="380" y="152" class="rng">Aug 23, 2026 - Sep 05, 2026</text>
<text x="633" y="78" class="big">181</text>
