    <stop offset="0" stop-color="#FB8C00"/>
    <stop offset="1" stop-color="#FFCA28"/>
  </linearGradient>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
  .big { font-size: 30px; font-weight: 700; fill: #e6edf3; }
  .lbl { font-size: 13px; fill: #70A5FD; font-weight: 600; }
